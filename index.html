<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>神戶・大阪 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: a 520px travel-booklet column — espresso header with a typeset flight block, sticky text tabs, date strip with large numerals, hairline-ruled timeline. Serif only for headings and large numerals; everything read closely is sans. */
:root{
  --paper:#f7f2ea; --surface:#fffdf8; --surface-2:#efe8de; --ink:#2a1f19; --ink-2:#4a3d34; --muted:#6e6156; --hair:#e5dccf;
  --brand:#3b2a22; --brand-2:#2f211a; --on-brand:#f6efe6; --on-brand-dim:#d6c6b6;
  --sel:#3b2a22; --on-sel:#f6efe6;
  --gold:#7a5236; --gold-hd:#d6c6b6; --accent:#a3352b; --sage:#4d6044; --plum:#6b3850; --teal:#7a5236;
  --l-hankyu:#7a2333; --l-jr:#0b6bb3; --l-port:#08719c; --l-nankai:#b9461a; --l-metro:#c8202b; --l-ksub:#25784a; --l-rope:#8a5a2b; --l-bus:#237544; --l-taxi:#4b5661; --l-walk:#5c6873; --on-line:#ffffff;
  --f-sans:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-serif:"Noto Serif TC","Noto Serif JP","Songti TC",serif;
  --f-latin:"Cormorant Garamond","Noto Serif TC","Noto Serif JP",Georgia,serif;
  --f-ja:"Noto Sans JP","Noto Sans TC","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14110f; --surface:#1c1815; --surface-2:#26201c; --ink:#f3ece4; --ink-2:#dacfc3; --muted:#b2a596; --hair:#352d27;
  --brand:#2a1e18; --brand-2:#211812; --on-brand:#f3ebe1; --on-brand-dim:#cdbba8;
  --sel:#d9b99a; --on-sel:#1a120d;
  --gold:#d9b99a; --gold-hd:#cdbba8; --accent:#ec9686; --sage:#adc0a0; --plum:#d7a3bb; --teal:#d9b99a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14110f; --surface:#1c1815; --surface-2:#26201c; --ink:#f3ece4; --ink-2:#dacfc3; --muted:#b2a596; --hair:#352d27;
  --brand:#2a1e18; --brand-2:#211812; --on-brand:#f3ebe1; --on-brand-dim:#cdbba8;
  --sel:#d9b99a; --on-sel:#1a120d;
  --gold:#d9b99a; --gold-hd:#cdbba8; --accent:#ec9686; --sage:#adc0a0; --plum:#d7a3bb; --teal:#d9b99a; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
:lang(ja){font-family:var(--f-ja)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-2)}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper)}
@media (min-width:560px){.app{box-shadow:0 0 0 1px var(--hair)}}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
a{color:var(--teal)}

/* header */
.hd{background:var(--brand);color:var(--on-brand)}
.hd-in{padding-block:24px 22px}
.hd-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kicker{font-family:var(--f-latin);font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--gold-hd)}
h1{font-family:var(--f-serif);font-weight:700;font-size:30px;letter-spacing:.1em;line-height:1.35;margin-top:4px}
.sub{font-size:13.5px;color:var(--on-brand-dim);margin-top:2px}
.count{flex-shrink:0;font-size:13.5px;font-weight:500;border:1px solid color-mix(in srgb,var(--gold-hd) 70%,transparent);color:var(--on-brand);border-radius:999px;padding:3px 12px;white-space:nowrap;margin-top:2px}
.rule{height:1px;background:color-mix(in srgb,var(--gold-hd) 45%,transparent);margin:18px 0 14px}
.flights{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 16px}
.flights .vr{background:color-mix(in srgb,var(--on-brand) 20%,transparent)}
.fl{min-width:0}
.fl-dir{font-size:13.5px;color:var(--on-brand-dim)}
.fl-route{font-family:var(--f-latin);font-weight:600;font-size:27px;letter-spacing:.05em;line-height:1.25;margin-top:2px;font-variant-numeric:lining-nums}
.fl-route span{font-size:17px;opacity:.65;margin:0 4px}
.fl-time{font-size:14px;font-weight:500;margin-top:2px}
.fl-meta{font-size:13.5px;color:var(--on-brand-dim);line-height:1.6;margin-top:1px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--hair)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;padding:13px 2px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;letter-spacing:.06em;text-indent:.06em}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sel);font-weight:700}

/* sub-tabs */
.subtabs{display:flex;flex-wrap:wrap;gap:8px;padding-block:16px 4px}
.st{appearance:none;border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:5px 15px;font-size:14.5px;cursor:pointer;color:var(--ink-2)}
.st[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel);font-weight:500}

/* date strip */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:8px 0;border-bottom:1px solid var(--hair)}
.day{appearance:none;border:0;background:transparent;padding:3px 2px 6px;text-align:center;cursor:pointer;min-width:0;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px}
.day .dw{font-size:11.5px;color:var(--muted);line-height:1.35}
.day .dd{font-family:var(--f-latin);font-weight:600;font-size:18px;line-height:1.15;color:var(--muted);font-variant-numeric:lining-nums}
.day .dc{font-size:11.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-pressed="true"]{border-bottom-color:var(--sel)}
.day[aria-pressed="true"] .dd{color:var(--sel)}
.day[aria-pressed="true"] .dc,.day[aria-pressed="true"] .dw{color:var(--ink);font-weight:500}
.day .td{position:absolute;top:5px;right:calc(50% - 15px);width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* day head */
.dh{padding-block:20px 4px}
.dh .ey{font-size:13.5px;font-weight:500;color:var(--sel);letter-spacing:.04em}
.dh h2{font-family:var(--f-serif);font-weight:700;font-size:23px;line-height:1.45;letter-spacing:.04em;margin-top:4px;text-wrap:balance}
.dh .ds{font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.8}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.fact{padding:10px 10px 10px 0;min-width:0}
.fact+.fact{padding-left:12px;border-left:1px solid var(--hair)}
.fact .k{font-size:13px;color:var(--muted)}
.fact .v{font-size:14px;font-weight:500;line-height:1.5;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.fact .v small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 0}
.bar .bl{font-size:13px;color:var(--muted)}
.linkbtn{appearance:none;border:0;background:none;color:var(--teal);font-size:14.5px;font-weight:500;cursor:pointer;padding:10px 0}

/* timeline */
.tl{padding-bottom:36px}
.it{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px;padding:18px 0;border-bottom:1px solid var(--hair)}
.it:last-child{border-bottom:0}
.tcol .tm{font-family:var(--f-latin);font-size:23px;font-weight:600;line-height:1.1;color:var(--ink);font-variant-numeric:lining-nums}
.it.now .tm{color:var(--sel)}
.tcol .nw{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--on-sel);background:var(--sel);padding:0 7px;border-radius:3px}
.body{min-width:0}
.cat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--c)}
.cat .du{color:var(--muted);font-weight:400}
.cat .mp{margin-left:auto;font-size:13.5px;color:var(--teal);text-decoration:none;white-space:nowrap;padding:10px 0 10px 12px;margin-top:-10px;margin-bottom:-10px}
.nm{font-size:17px;font-weight:700;line-height:1.5;margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.nm .bd{font-size:12.5px;font-weight:500;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px;padding:0 6px;line-height:1.7}
.jp{font-size:13px;color:var(--muted);line-height:1.5}
.sm{font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.8}
.pr{font-size:14px;color:var(--ink-2);margin-top:4px;font-weight:500}
.more{appearance:none;border:0;background:none;color:var(--teal);font-size:14.5px;font-weight:500;padding:10px 0 0;cursor:pointer}
.x{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.desc{font-size:14.5px;line-height:1.85;color:var(--ink)}
.note{font-size:14px;line-height:1.75;background:var(--surface-2);border-radius:6px;padding:9px 12px;color:var(--ink)}
.note b{color:var(--accent);font-weight:700;margin-right:6px}
.route{display:flex;flex-direction:column;gap:8px}
.rr{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.65}
.ln{flex-shrink:0;font-size:12px;font-weight:700;color:var(--on-line);background:var(--lc);border-radius:3px;padding:1px 0;width:70px;text-align:center;margin-top:2px}
.opts{border-top:1px solid var(--hair)}
.opl{font-size:13.5px;font-weight:500;color:var(--muted);padding:10px 0 2px}
.op{padding:10px 0;border-bottom:1px solid var(--hair)}
.oph{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.opn{font-weight:700;font-size:15px}
.opp{font-size:13.5px;color:var(--ink-2);font-weight:500}
.opb{font-size:12.5px;color:var(--sel);border:1px solid color-mix(in srgb,var(--sel) 50%,transparent);border-radius:3px;padding:0 5px}
.opm{margin-left:auto;font-size:13.5px;color:var(--teal);text-decoration:none;white-space:nowrap;padding:10px 0 10px 12px;margin-top:-10px;margin-bottom:-10px}
.opd{font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.8}
.talks{margin-top:10px;border-top:1px solid var(--hair)}
.talks .ch{font-size:13.5px;color:var(--muted);padding:8px 0 2px}
.tk{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--hair)}
.tk:last-child{border-bottom:0}
.tk .tt{font-size:14px;font-weight:500;color:var(--muted)}
.tk .who{font-size:14px;font-weight:700;line-height:1.55}
.tk .ttl{font-size:14px;color:var(--ink-2);line-height:1.65;margin-top:1px}

/* sections */
.sec{padding-block:20px 6px}
.sec h3{font-family:var(--f-serif);font-size:20px;font-weight:700;letter-spacing:.04em;line-height:1.4}
.sec .lead{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.75}
.grp{font-size:13.5px;font-weight:700;color:var(--sel);margin-top:6px;letter-spacing:.04em}
.list{margin-top:8px;border-top:1px solid var(--hair)}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--hair)}
.row-t{min-width:0;flex:1}
.rn{font-weight:700;font-size:15.5px;line-height:1.5}
.rj{font-size:13px;color:var(--muted)}
.rd{font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.8}
.rp{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;align-items:baseline;font-size:13.5px}
.rp .p{color:var(--ink-2);font-weight:500}
.rp .w{color:var(--muted)}
.rm{flex-shrink:0;font-size:13.5px;color:var(--teal);text-decoration:none;white-space:nowrap;padding:12px 0 12px 12px;margin:-10px 0}
.rday{flex-shrink:0;font-size:13px;color:var(--muted);padding-top:3px;white-space:nowrap}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 12px;font-size:14.5px;margin-top:10px;line-height:1.8}
.kv dt{color:var(--muted)}
.big{font-family:var(--f-latin);font-size:25px;font-weight:600;font-variant-numeric:lining-nums;letter-spacing:.03em;line-height:1.3}
.cico{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cico div{padding:8px 0}
.cico div+div{border-left:1px solid var(--hair);padding-left:12px}
.cico .l{font-size:13px;color:var(--muted)}
.cico .v{font-family:var(--f-latin);font-weight:600;font-size:24px;font-variant-numeric:lining-nums;line-height:1.2}
.taxi{padding:16px 0;border-bottom:1px solid var(--hair)}
.taxi .tz{font-size:13px;color:var(--muted)}
.taxi .jpl{font-size:21px;font-weight:700;line-height:1.6;margin-top:4px;-webkit-user-select:text;user-select:text}
.taxi .ad{font-size:15px;color:var(--ink-2);margin-top:2px;-webkit-user-select:text;user-select:text}
.copy{appearance:none;border:1px solid var(--hair);background:var(--surface);border-radius:999px;font-size:13.5px;padding:5px 14px;cursor:pointer;color:var(--teal);margin-top:8px}
.tel{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.tel .tn{font-size:19px;font-weight:700;letter-spacing:.02em;-webkit-user-select:text;user-select:text}
.tel .copy{margin-top:0}
.ol{counter-reset:s;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ol div{display:grid;grid-template-columns:24px minmax(0,1fr);font-size:14.5px;line-height:1.85}
.ol div::before{counter-increment:s;content:counter(s);font-family:var(--f-latin);font-weight:600;font-size:18px;color:var(--sel);line-height:1.6}

/* tools */
.conv{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.cv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cv-row label{font-size:13.5px;color:var(--muted);min-width:34px}
.cv-in{font-family:var(--f-latin);font-variant-numeric:lining-nums;font-size:27px;font-weight:600;width:100%;max-width:150px;border:0;border-bottom:1px solid var(--ink-2);background:transparent;color:var(--ink);padding:0 2px}
.cv-in.sm{font-size:21px;max-width:96px}
.unit{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:5px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.result{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.result .rl{font-size:13.5px;color:var(--muted)}
.result .rv{font-family:var(--f-latin);font-variant-numeric:lining-nums;font-size:36px;font-weight:600;line-height:1.25;color:var(--sel)}
.qt{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;font-size:14px}
.qt div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hair)}
.qt span:first-child{font-weight:500}
.qt span:last-child{color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);line-height:1.8}
.foot{font-size:13px;color:var(--muted);padding-block:22px 34px;line-height:1.8}
@media (prefers-reduced-motion:no-preference){.tab,.day,.st{transition:color .15s,border-color .15s,background-color .15s}}
</style>

<div class="app" lang="zh-Hant">
  <header class="hd">
    <div class="g hd-in">
      <div class="hd-top">
        <div>
          <div class="kicker">KOBE · OSAKA</div>
          <h1>神戶・大阪</h1>

      <div class="rule"></div>
      <div class="flights">

<script>
/* ═══════════ DATA ═══════════
   Chinese copy uses 神戶／舊／心齋橋／關; Japanese spellings stay only in map queries, jp lines, taxi cards and Japanese names. */
const LINES={
  hankyu:["阪急","--l-hankyu"], jr:["JR","--l-jr"], port:["Port Liner","--l-port"], nankai:["南海","--l-nankai"],
  metro:["御堂筋線","--l-metro"], ksub:["神戶地鐵","--l-ksub"], rope:["纜車","--l-rope"], bus:["公車","--l-bus"],
  taxi:["計程車","--l-taxi"], walk:["步行","--l-walk"]
};
const CAT={eat:["美食","--sel"],cafe:["咖啡","--sel"],go:["景點","--sel"],shop:["購物","--sel"],tr:["交通","--muted"],stay:["住宿","--sel"],work:["會議","--sel"]};

const DAYS=[
{iso:"2026-11-12",d:"12",dw:"四",city:"神戶",title:"抵達神戶・元町與港邊",
 sum:"中午抵達。下午從南京町吃到舊居留地，在百年洋館喝下午茶，傍晚到海邊看夕陽，晚上吃燒肉。",
 wx:["晴時多雲","12–19°","降雨 30%"],stay:["remm plus 神戶三宮","第 1 晚"],pace:["適中","日落 16:57"],
 items:[
 {t:"06:20",cmp:"07:20",tz:"台灣時間",cat:"tr",n:"桃園機場 T1 報到",sum:"星宇 JX1834 08:20 起飛。託運 1 件，飛行 2 小時 25 分鐘，日本比台灣快 1 小時。"},

function load(k,d){try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}
function jst(){
  try{const s=new Date().toLocaleString("sv-SE",{timeZone:"Asia/Tokyo"});return {date:s.slice(0,10),hm:s.slice(11,16)}}
  catch(e){const s=new Date(Date.now()+9*3600e3).toISOString();return {date:s.slice(0,10),hm:s.slice(11,16)}}
}

const gm=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const ntd=n=>"NT$ "+Math.round(n).toLocaleString("en-US");

function countText(){
  const start=Date.UTC(2026,10,12), end=Date.UTC(2026,10,16);
  const [y,m,d]=NOW.date.split("-").map(Number); const t=Date.UTC(y,m-1,d);
  const diff=Math.round((start-t)/864e5);
  if(diff>1)return `${diff} 天後出發`;
  if(diff===1)return "明天出發";
  if(t<=end)return `旅程第 ${Math.round((t-start)/864e5)+1} 天`;
  return "旅程結束";
}
function nowIndex(day){
  if(DAYS.indexOf(day)!==todayIdx)return -1;
  let idx=-1; day.items.forEach((it,i)=>{if((it.cmp||it.t)<=NOW.hm)idx=i}); return idx;
}
function block(b){
  if(b.d)return `<div class="desc">${b.d}</div>`;
  if(b.n)return `<div class="note">${b.h?`<b>${b.h}</b>`:""}${b.n}</div>`;
  if(b.r)return `<div class="route">${b.r.map(([l,t])=>{const L=LINES[l];return `<div class="rr"><span class="ln" style="--lc:var(${L[1]})">${L[0]}</span><span>${t}</span></div>`}).join("")}</div>`;
  if(b.f)return `<div class="opts"><div class="opl">${b.f.l}</div>${b.f.o.map(o=>`<div class="op"><div class="oph"><span class="opn">${o.n}</span>${o.p?`<span class="opp">${o.p}</span>`:""}${o.b?`<span class="opb">${o.b}</span>`:""}${o.q?`<a class="opm" href="${gm(o.q)}" target="_blank" rel="noopener">地圖 ↗</a>`:""}</div>${o.d?`<div class="opd">${o.d}</div>`:""}</div>`).join("")}</div>`;
  return "";
}
function talksHtml(t){
  return `<div class="talks"><div class="ch">${esc(t.ch)}</div>${t.l.map(r=>`<div class="tk"><span class="tt">${r[0]}</span><div><div class="who">${esc(r[1])}</div><div class="ttl">${esc(r[2])}</div></div></div>`).join("")}</div>`;
}
function subtabs(list,cur,act){return `<div class="subtabs g">${list.map(([k,l])=>`<button class="st" data-act="${act}" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join("")}</div>`}

function viewPlan(){
  const d=DAYS[sel], ni=nowIndex(d);
  const days=`<div class="days g">${DAYS.map((x,i)=>`<button class="day" data-day="${i}" aria-pressed="${i===sel}" aria-label="11/${x.d} ${x.dw} ${x.city}${i===todayIdx?"（今天）":""}">${i===todayIdx?'<span class="td" aria-hidden="true"></span>':""}<div class="dw">${x.dw}</div><div class="dd">${x.d}</div><div class="dc">${x.city}</div></button>`).join("")}</div>`;
  const head=`<div class="dh g"><div class="ey">第 ${sel+1} 天・11/${d.d}（${d.dw}）</div><h2>${d.title}</h2><div class="ds">${d.sum}</div>
    <div class="facts">
      <div class="fact"><div class="k">天氣</div><div class="v">${d.wx[0]}<small>${d.wx[1]}<br>${d.wx[2]}</small></div></div>
      <div class="fact"><div class="k">住宿</div><div class="v">${d.stay[0]}<small>${d.stay[1]}</small></div></div>
      <div class="fact"><div class="k">節奏</div><div class="v">${d.pace[0]}<small>${d.pace[1]}</small></div></div>
    </div></div>`;
  const anyOpen=d.items.some((it,i)=>it.x&&open.has(sel+"-"+i));
  const bar=`<div class="bar g"><span class="bl">天氣：tenki.jp 11/11 預報</span><button class="linkbtn" data-act="all">${anyOpen?"全部收合 −":"全部展開 ＋"}</button></div>`;
  const tl=`<div class="tl g">${d.items.map((it,i)=>{
    const key=sel+"-"+i, isOpen=open.has(key), C=CAT[it.cat]||CAT.tr;
    const durTxt=it.dur?`${it.cat==="tr"?"車程":"停留"} ${it.dur}`:(it.tz||"");
    return `<div class="it${i===ni?" now":""}" style="--c:var(${C[1]})">
      <div class="tcol"><div class="tm">${it.t}</div>${i===ni?'<span class="nw">現在</span>':""}</div>
      <div class="body">
        <div class="cat"><span>${C[0]}</span>${durTxt?`<span class="du">${durTxt}</span>`:""}${it.q?`<a class="mp" href="${gm(it.q)}" target="_blank" rel="noopener">地圖 ↗</a>`:""}</div>
        <div class="nm"><span>${it.n}</span>${it.bd?`<span class="bd">${it.bd}</span>`:""}</div>
        ${it.jp?`<div class="jp" lang="ja">${it.jp}</div>`:""}
        ${it.sum?`<div class="sm">${it.sum}</div>`:""}
        ${it.price?`<div class="pr">${it.price}</div>`:""}
        ${it.talks?talksHtml(it.talks):""}
        ${it.x?`<button class="more" data-act="toggle" data-key="${key}" aria-expanded="${isOpen}">${isOpen?"收合 −":"展開 ＋"}</button>`:""}
        ${it.x&&isOpen?`<div class="x">${it.x.map(block).join("")}</div>`:""}
      </div></div>`}).join("")}</div>`;
  return days+head+bar+tl;
}

      <div class="desc" style="margin-top:10px">2 晚。阪急神戶三宮站東口 2 樓直通，JR 三ノ宮站西口旁。11/14 退房後可以寄放行李。 ${mapA("remm plus Kobe Sannomiya")}</div></section>
    <section class="sec g"><h3>OMO關西空港 by 星野リゾート</h3><div class="lead" lang="ja">大阪府泉佐野市りんくう往来北1-833</div>
      <div class="cico"><div><div class="l">入住 11/14</div><div class="v">15:00</div></div><div><div class="l">退房 11/16</div><div class="v">11:00</div></div></div>
      <div class="desc" style="margin-top:10px">2 晚。りんくうタウン站 5 號出口步行 1 分鐘，離關西機場一站，2 樓有超商。 ${mapA("OMO Kansai Airport by Hoshino Resorts")}</div>
      <div class="list" style="margin-top:12px">
        <div class="row"><div class="row-t"><div class="rn">機場接駁巴士（已預約）</div><div class="rd">11/16 10:00 發車，只開往機場。提前 10 分鐘到 1 樓入口巴士站，給司機看預約信，到 T1 約 10 分鐘。</div></div></div>
        <div class="row"><div class="row-t"><div class="rn">OMOダイニング（21 樓）</div><div class="rd">早餐 buffet 06:00–10:00（09:30 最後入場），約 ¥2,500。晚餐單點約 ¥2,000 起；10/5–12/3 縮短為 18:00–20:00（19:45 最後點餐），菜單較少。</div></div></div>
        <div class="row"><div class="row-t"><div class="rn">22 樓酒吧</div><div class="rd">18:00–22:00（21:45 最後點餐），只有下酒菜。</div></div></div></div></section>`;
  }else if(infoSub==="move"){
    h=`<section class="sec g"><h3>交通小抄</h3><div class="list">
      <div class="row"><div class="row-t"><div class="rn">一張 IC 卡就夠</div><div class="rd">iPhone 錢包加 Suica 或 ICOCA，Port Liner、阪急、JR、南海、地鐵、公車都能用。</div></div></div>
      <div class="row"><div class="row-t"><div class="rn">三宮有好幾個車站</div><div class="rd">阪急「神戶三宮」（飯店直通）、JR「三ノ宮」、地鐵「三宮」名稱不同，但都在附近；Port Liner 的三宮站在 JR 東口上方。</div></div></div>
      <div class="row"><div class="row-t"><div class="rn">關空快速坐 1–4 號車</div><div class="rd">從大阪出發時和紀州路快速連在一起，5–8 號車會在日根野分開去和歌山。</div></div></div>
      <div class="row"><div class="row-t"><div class="rn">南海空港急行不用加價</div><div class="rd">りんくうタウン到難波 ¥820，約 49 分鐘。rapi:t 比較快，但要另外買特急券。</div></div></div>
      <div class="row"><div class="row-t"><div class="rn">御堂筋線（紅色）</div><div class="rd">心齋橋、難波、梅田都在這條線上。</div></div></div></div></section>
      <section class="sec g"><h3>主要路線</h3><div class="list">
      ${[["11/12","神戶機場 → 三宮","T2 步行約 10 分鐘到站，Port Liner 約 18 分鐘・¥340"],["11/13","三宮 → 神戶大學","阪急到六甲約 8 分鐘，再搭公車或計程車約 10 分鐘"],["11/14","三宮 → 新神戶","神戶地鐵 1 站約 2 分鐘"],["11/14","三宮 → りんくうタウン","機場巴士到關西機場 T1 約 65 分鐘・¥2,200，再搭電車一站・¥370（備案：JR 約 1 小時 40 分鐘・約 ¥1,600）"],["11/15","りんくうタウン → 難波","南海空港急行約 49 分鐘・¥820"],["11/15","難波 → 梅田","御堂筋線約 8 分鐘・¥240"],["11/15","大阪 → りんくうタウン","JR 關空快速約 67 分鐘・約 ¥1,000"],["11/16","OMO → 關西機場 T1","飯店接駁巴士 10:00 發車・約 10 分鐘"]].map(([d,a,b])=>`<div class="row"><div class="row-t"><div class="rn">${a}</div><div class="rd">${b}</div></div><span class="rday">${d}</span></div>`).join("")}</div></section>`;
  }else if(infoSub==="taxi"){
    h=`<section class="sec g"><h3>給司機看</h3><div class="lead">把手機拿給計程車司機看，或複製地址貼到 Google 地圖。</div>
      ${TAXI.map(t=>`<div class="taxi"><div class="tz">${t.z}</div><div class="jpl" lang="ja">${t.jp}</div><div class="ad" lang="ja">${t.ad}</div><button class="copy" data-act="copy" data-text="${esc(t.ad)}">複製地址</button></div>`).join("")}</section>`;
  }else if(infoSub==="tax"){
    h=`<section class="sec g"><h3>退稅新制</h3><div class="lead">2026 年 11 月 1 日起改為「先付稅、出境後退」。</div>
      <div class="ol">
        <div>在免稅店結帳時先付含稅價格，出示護照登記。</div>
        <div>出境時到機場的免稅手續 kiosk 刷護照，接受海關確認，可能要看商品。</div>
        <div>確認後由店家或代辦業者退回消費稅。退款方式依店家而異，結帳時問清楚。</div>
        <div>同一家店同一天買滿 ¥5,000（未稅）才適用；在日本吃掉或用掉的商品不能退。</div></div>
      <div class="note" style="margin-top:14px"><b>注意</b>退稅商品放在託運行李的話，要先到 kiosk 確認，再去託運。</div></section>`;
  }else{
    h=`<section class="sec g"><h3>緊急聯絡</h3><div class="list" style="border-top:0">
      ${[["警察","110"],["救護車・消防","119"],["訪日外國人熱線（JNTO，24 小時，可說中文）","050-3816-2787"],["駐大阪辦事處 急難救助（日本境內撥打）","090-8794-4568"],["駐大阪辦事處（上班時間）","06-6227-8623"]].map(([n,t])=>`<div class="tel"><div class="row-t"><div class="rd" style="margin:0">${n}</div><div class="tn">${t}</div></div><button class="copy" data-act="copy" data-text="${t}">複製</button></div>`).join("")}</div></section>`;
  }
  return st+h+`<div class="foot g">交通與價格為 2026 年的參考值，以現場公告為準。</div>`;
}

function convResult(){
  if(dir==="jpy")return {v:ntd(amt*rate),s:`${yen(amt)} × ${rate}`};
  return {v:yen(rate?amt/rate:0),s:`NT$ ${amt.toLocaleString("en-US")} ÷ ${rate}`};
}
function quickRows(){return [100,500,1000,2000,3000,5000,10000,20000].map(n=>`<div><span>${yen(n)}</span><span>${ntd(n*rate)}</span></div>`).join("")}
function viewTools(){
  const r=convResult();
  return `<section class="sec g"><h3>匯率換算</h3><div class="conv">
    <div class="cv-row"><label for="rate">匯率</label><span class="unit">¥1 =</span><input class="cv-in sm" id="rate" type="number" inputmode="decimal" step="0.001" value="${rate}"><span class="unit">NT$</span></div>
    <div class="cv-row"><label for="amt">金額</label><input class="cv-in" id="amt" type="number" inputmode="decimal" value="${amt}">
      <span class="seg"><button data-act="dir" data-dir="jpy" aria-pressed="${dir==="jpy"}">日幣</button><button data-act="dir" data-dir="twd" aria-pressed="${dir==="twd"}">台幣</button></span></div>
    <div class="result"><div class="rl">換算結果</div><div class="rv" id="rv">${r.v}</div><div class="rl" id="rs">${r.s}</div></div>
    <div class="qt" id="qt">${quickRows()}</div>
    <div class="hint">預設 0.213 是臺灣銀行 11 月初的日幣現金賣出匯率。可以改成你換匯或刷卡的匯率，會記在這支手機上。</div>
  </div></section>
  <section class="sec g"><h3>出發前清單</h3><div class="list">
    ${CHECK.map(([id,t])=>`<div class="row"><div class="row-t"><div class="rd" style="margin:0;color:var(--ink);font-size:15px">${t}</div></div></div>`).join("")}</div></section>
  <div class="foot g">退稅門檻：同一家店同一天 ¥5,000（未稅）以上。</div>`;
}

/* ═══════════ RENDER ═══════════ */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  const v=document.getElementById("view");
  v.setAttribute("aria-labelledby","tab-"+tab);
  v.innerHTML=tab==="plan"?viewPlan():tab==="food"?viewFood():tab==="places"?viewPlaces():tab==="info"?viewInfo():viewTools();
}
/* re-render, then put focus back on the control that was used */
function rr(el){
  const sel2=[...el.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${CSS.escape?CSS.escape(x.value):x.value}"]`).join("");
  render();
  if(sel2){const n=document.querySelector("#view "+sel2);if(n)n.focus({preventScroll:true})}
}
function updateConv(){
  const r=convResult();
  const rv=document.getElementById("rv"),rs=document.getElementById("rs"),qt=document.getElementById("qt");
  if(rv)rv.textContent=r.v; if(rs)rs.textContent=r.s; if(qt)qt.innerHTML=quickRows();
}
function tick(){
  const prevIdx=todayIdx, prevNow=todayIdx>=0?nowIndex(DAYS[sel]):-1;
  NOW=jst(); todayIdx=DAYS.findIndex(d=>d.iso===NOW.date);
  document.getElementById("count").textContent=countText();
  if(tab==="plan"&&(prevIdx!==todayIdx||prevNow!==nowIndex(DAYS[sel])))render();
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  tab=b.dataset.tab; save("tab",tab); render();
  const hd=document.querySelector(".hd"); const h=hd?hd.offsetHeight:0;
  if(window.scrollY>h)window.scrollTo({top:h});
});
document.getElementById("view").addEventListener("click",e=>{
  const day=e.target.closest("[data-day]");
  if(day){sel=+day.dataset.day;save("day",sel);rr(day);return}
  const a=e.target.closest("[data-act]"); if(!a)return;
  const act=a.dataset.act;
  if(act==="toggle"){const k=a.dataset.key;open.has(k)?open.delete(k):open.add(k);rr(a)}
  else if(act==="all"){const d=DAYS[sel];const any=d.items.some((it,i)=>it.x&&open.has(sel+"-"+i));d.items.forEach((it,i)=>{if(it.x){const k=sel+"-"+i;any?open.delete(k):open.add(k)}});rr(a)}
  else if(act==="food"){foodSub=a.dataset.k;save("foodSub",foodSub);rr(a)}
  else if(act==="info"){infoSub=a.dataset.k;save("infoSub",infoSub);rr(a)}
  else if(act==="place"){placeSub=a.dataset.k;save("placeSub",placeSub);rr(a)}
  else if(act==="dir"){dir=a.dataset.dir;save("dir",dir);rr(a)}
  else if(act==="copy"){
    const txt=a.dataset.text, orig=a.dataset.label||(a.dataset.label=a.textContent);
    const ok=()=>{a.textContent="已複製";setTimeout(()=>{a.textContent=orig},1400)};
    const fallback=()=>{const el=a.parentElement.querySelector(".ad,.tn");if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}a.textContent="已選取，請長按複製";setTimeout(()=>{a.textContent=orig},2000)};
    try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(err){fallback()}
  }
});
document.getElementById("view").addEventListener("input",e=>{
  if(e.target.id==="rate"){rate=parseFloat(e.target.value)||0;save("rate",rate);updateConv()}
  else if(e.target.id==="amt"){amt=parseFloat(e.target.value)||0;save("amt",amt);updateConv()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick()});
setInterval(tick,60000);
document.getElementById("count").textContent=countText();
render();
if(tab==="plan"&&todayIdx===sel){const n=document.querySelector(".it.now");if(n)n.scrollIntoView({block:"center"})}
</script>
