<style>
/* Layout: a 520px travel-booklet column — espresso header, sticky text tabs, compact date strip, hairline-ruled timeline.
   Noto Serif TC for headings, Noto Sans TC for reading, Cormorant Garamond for stand-alone numerals (flights, dates, times) — like an airline ticket.
   Type scale: 12.5 caption · 14 detail · 15 body · 16.5 item title · 19 section · 22 day title · 26 page title. */
:root{
  --paper:#f7f2ea; --surface:#fffdf8; --surface-2:#efe8de; --ink:#2a1f19; --ink-2:#4a3d34; --muted:#6e6156; --hair:#e5dccf;
  --brand:#3b2a22; --brand-2:#2f211a; --on-brand:#f6efe6; --on-brand-dim:#d6c6b6;
  --sel:#3b2a22; --on-sel:#f6efe6; --accent:#a3352b; --link:#7a5236;
  --l-hankyu:#7a2333; --l-jr:#0b6bb3; --l-port:#08719c; --l-nankai:#b9461a; --l-metro:#c8202b; --l-ksub:#25784a; --l-rope:#8a5a2b; --l-bus:#237544; --l-taxi:#4b5661; --l-walk:#5c6873; --on-line:#ffffff;
  --fs-cap:12.5px; --fs-sm:14px; --fs-body:15px; --fs-title:16.5px; --fs-h3:19px; --fs-h2:22px; --fs-h1:26px;
  --f-sans:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-serif:"Noto Serif TC","Noto Serif JP","Songti TC",serif;
  --f-ja:"Noto Sans JP","Noto Sans TC","Hiragino Sans",sans-serif;
  --f-num:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14110f; --surface:#1c1815; --surface-2:#26201c; --ink:#f3ece4; --ink-2:#dacfc3; --muted:#b2a596; --hair:#352d27;
  --brand:#2a1e18; --brand-2:#211812; --on-brand:#f3ebe1; --on-brand-dim:#cdbba8;
  --sel:#d9b99a; --on-sel:#1a120d; --accent:#ec9686; --link:#d9b99a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14110f; --surface:#1c1815; --surface-2:#26201c; --ink:#f3ece4; --ink-2:#dacfc3; --muted:#b2a596; --hair:#352d27;
  --brand:#2a1e18; --brand-2:#211812; --on-brand:#f3ebe1; --on-brand-dim:#cdbba8;
  --sel:#d9b99a; --on-sel:#1a120d; --accent:#ec9686; --link:#d9b99a; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:var(--fs-body);line-height:1.75;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
:lang(ja){font-family:var(--f-ja)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-2)}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper)}
@media (min-width:560px){.app{box-shadow:0 0 0 1px var(--hair)}}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
a{color:var(--link)}

/* header */
.hd{background:var(--brand);color:var(--on-brand)}
.hd-in{padding-block:22px 20px}
.hd-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-family:var(--f-serif);font-weight:700;font-size:var(--fs-h1);letter-spacing:.08em;line-height:1.35}
.sub{font-size:var(--fs-cap);color:var(--on-brand-dim);margin-top:2px}
.count{flex-shrink:0;font-size:var(--fs-cap);border:1px solid color-mix(in srgb,var(--on-brand) 35%,transparent);border-radius:999px;padding:2px 11px;white-space:nowrap;margin-top:4px}
.kicker{font-family:var(--f-num);font-size:14px;font-weight:600;letter-spacing:.16em;color:var(--on-brand-dim)}
.flights{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 16px;margin-top:16px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--on-brand) 20%,transparent)}
.flights .vr{background:color-mix(in srgb,var(--on-brand) 20%,transparent)}
.fl{min-width:0}
.fl-dir{font-size:var(--fs-cap);color:var(--on-brand-dim)}
.fl-route{font-family:var(--f-num);font-size:27px;font-weight:600;letter-spacing:.05em;line-height:1.25;margin-top:2px;font-variant-numeric:lining-nums}
.fl-route span{font-size:17px;opacity:.65;margin:0 4px}
.fl-time{font-family:var(--f-num);font-size:16.5px;font-weight:600;letter-spacing:0;white-space:nowrap;font-variant-numeric:lining-nums}
.fl-meta{font-size:var(--fs-cap);color:var(--on-brand-dim);line-height:1.6}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hair)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:var(--fs-body);font-weight:500;padding:12px 2px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sel);font-weight:700}

/* sub-tabs */
.subtabs{display:flex;flex-wrap:wrap;gap:8px;padding-block:16px 4px}
.st{appearance:none;border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink-2)}
.st[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}

/* date strip */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:6px 0;border-bottom:1px solid var(--hair)}
.day{appearance:none;border:0;background:transparent;padding:6px 2px 8px;text-align:center;cursor:pointer;min-width:0;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px;line-height:1.4;color:var(--muted)}
.day .dw{font-size:var(--fs-cap)}
.day .dd{font-family:var(--f-num);font-size:21px;font-weight:600;line-height:1.2;font-variant-numeric:lining-nums}
.day .dc{font-size:var(--fs-cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-pressed="true"]{border-bottom-color:var(--sel);color:var(--ink)}
.day .td{position:absolute;top:8px;right:calc(50% - 14px);width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* day head */
.dh{padding-block:20px 0}
.dh .ey{font-size:var(--fs-cap);color:var(--muted)}
.dh h2{font-family:var(--f-serif);font-weight:700;font-size:var(--fs-h2);line-height:1.45;letter-spacing:.04em;margin-top:2px;text-wrap:balance}
.dh .ds{color:var(--ink-2);margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.fact{padding:10px 10px 10px 0;min-width:0}
.fact+.fact{padding-left:12px;border-left:1px solid var(--hair)}
.fact .k{font-size:var(--fs-cap);color:var(--muted)}
.fact .v{font-size:var(--fs-sm);font-weight:500;line-height:1.55;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.fact .v small{display:block;font-size:var(--fs-cap);color:var(--muted);font-weight:400}
.bar{display:flex;justify-content:flex-end;padding-block:6px 0}
.linkbtn{appearance:none;border:0;background:none;color:var(--link);font-size:var(--fs-sm);cursor:pointer;padding:8px 0}

/* timeline */
.tl{padding-bottom:16px}
.it{display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 12px;padding:16px 0;border-bottom:1px solid var(--hair)}
.it:last-child{border-bottom:0}
.tcol .tm{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.25;color:var(--ink);font-variant-numeric:lining-nums}
.it.now .tm{color:var(--accent)}
.tcol .nw{display:inline-block;margin-top:4px;font-size:var(--fs-cap);font-weight:700;color:var(--on-sel);background:var(--sel);padding:0 6px;border-radius:3px}
.body{min-width:0}
.cat{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-cap);color:var(--muted);line-height:1.5}
.cat .du{color:var(--muted)}
.cat .mp{margin-left:auto;color:var(--link);text-decoration:none;white-space:nowrap;padding:10px 0 10px 12px;margin-top:-10px;margin-bottom:-10px}
.nm{font-size:var(--fs-title);font-weight:700;line-height:1.5;margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.nm .bd{font-size:var(--fs-cap);font-weight:500;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px;padding:0 6px;line-height:1.6}
.jp{font-size:var(--fs-cap);color:var(--muted);line-height:1.5}
.sm{color:var(--ink-2);margin-top:4px}
.pr{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.more{appearance:none;border:0;background:none;color:var(--link);font-size:20px;line-height:1;padding:8px 16px 4px 0;cursor:pointer}
.x{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.desc{font-size:var(--fs-sm);line-height:1.85;color:var(--ink)}
.note{font-size:var(--fs-sm);line-height:1.75;background:var(--surface-2);border-radius:6px;padding:8px 12px}
.note b{color:var(--accent);margin-right:6px}
.route{display:flex;flex-direction:column;gap:6px}
.rr{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm);line-height:1.65}
.ln{flex-shrink:0;font-size:var(--fs-cap);font-weight:700;color:var(--on-line);background:var(--lc);border-radius:3px;width:70px;text-align:center;margin-top:1px;line-height:1.7}
.opts{border-top:1px solid var(--hair)}
.opl{font-size:var(--fs-cap);color:var(--muted);padding:10px 0 0}
.op{padding:9px 0;border-bottom:1px solid var(--hair)}
.oph{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.opn{font-weight:700;font-size:var(--fs-body)}
.opp{font-size:var(--fs-sm);color:var(--ink-2)}
.opb{font-size:var(--fs-cap);color:var(--sel);border:1px solid color-mix(in srgb,var(--sel) 45%,transparent);border-radius:3px;padding:0 5px;line-height:1.6}
.opm{margin-left:auto;font-size:var(--fs-cap);color:var(--link);text-decoration:none;white-space:nowrap;padding:10px 0 10px 12px;margin-top:-10px;margin-bottom:-10px}
.opd{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px;line-height:1.8}
.talks{margin-top:8px;border-top:1px solid var(--hair)}
.talks .ch{font-size:var(--fs-cap);color:var(--muted);padding:8px 0 0}
.tk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:var(--fs-sm);line-height:1.65}
.tk:last-child{border-bottom:0}
.tk .tt{color:var(--muted)}
.tk .who{font-weight:700}
.tk .ttl{color:var(--ink-2)}
.tfoot{font-size:var(--fs-cap);color:var(--muted);padding-block:0 32px}

/* sections */
.sec{padding-block:20px 6px}
.sec h3{font-family:var(--f-serif);font-size:var(--fs-h3);font-weight:700;letter-spacing:.04em;line-height:1.4}
.sec .lead{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.grp{font-size:var(--fs-cap);font-weight:700;color:var(--ink-2);margin-top:18px;letter-spacing:.04em}
.list{margin-top:8px;border-top:1px solid var(--hair)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair)}
.row-t{min-width:0;flex:1}
.rn{font-weight:700;font-size:var(--fs-body);line-height:1.5}
.rj{font-size:var(--fs-cap);color:var(--muted)}
.rd{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px;line-height:1.8}
.rp{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;font-size:var(--fs-cap);color:var(--muted)}
.rp .p{color:var(--ink-2)}
.rm{flex-shrink:0;font-size:var(--fs-cap);color:var(--link);text-decoration:none;white-space:nowrap;padding:12px 0 12px 12px;margin:-10px 0}
.rday{flex-shrink:0;font-size:var(--fs-cap);color:var(--muted);padding-top:2px;white-space:nowrap}
.kv{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 12px;font-size:var(--fs-sm);margin-top:10px;line-height:1.8}
.kv dt{color:var(--muted)}
.big{font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:.03em;font-variant-numeric:lining-nums}
.cico{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cico div{padding:8px 0}
.cico div+div{border-left:1px solid var(--hair);padding-left:12px}
.cico .l{font-size:var(--fs-cap);color:var(--muted)}
.cico .v{font-family:var(--f-num);font-size:21px;font-weight:600;font-variant-numeric:lining-nums}
.taxi{padding:14px 0;border-bottom:1px solid var(--hair)}
.taxi .tz{font-size:var(--fs-cap);color:var(--muted)}
.taxi .jpl{font-size:var(--fs-h3);font-weight:700;line-height:1.6;margin-top:2px;-webkit-user-select:text;user-select:text}
.taxi .ad{font-size:var(--fs-sm);color:var(--ink-2);-webkit-user-select:text;user-select:text}
.copy{appearance:none;border:1px solid var(--hair);background:var(--surface);border-radius:999px;font-size:var(--fs-cap);padding:4px 14px;cursor:pointer;color:var(--link);margin-top:8px}
.tel{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.tel .tn{font-size:var(--fs-title);font-weight:700;-webkit-user-select:text;user-select:text}
.tel .copy{margin-top:0}
.ol{counter-reset:s;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ol div{display:grid;grid-template-columns:22px minmax(0,1fr);font-size:var(--fs-sm);line-height:1.85}
.ol div::before{counter-increment:s;content:counter(s) ".";font-weight:700;color:var(--ink-2)}

/* tools */
.conv{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.cv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cv-row label{font-size:var(--fs-cap);color:var(--muted);min-width:34px}
.cv-in{font-family:inherit;font-size:var(--fs-h3);font-weight:700;width:100%;max-width:150px;border:0;border-bottom:1px solid var(--ink-2);background:transparent;color:var(--ink);padding:0 2px}
.cv-in.sm{max-width:90px}
.unit{font-size:var(--fs-sm);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:4px 14px;font-size:var(--fs-sm);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
.result{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.result .rl{font-size:var(--fs-cap);color:var(--muted)}
.result .rv{font-family:var(--f-num);font-size:32px;font-weight:600;line-height:1.3;color:var(--ink);font-variant-numeric:lining-nums}
.qt{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;font-size:var(--fs-sm)}
.qt div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hair)}
.qt span:last-child{color:var(--muted)}
.hint{font-size:var(--fs-cap);color:var(--muted);line-height:1.8}
.foot{font-size:var(--fs-cap);color:var(--muted);padding-block:20px 32px;line-height:1.8}
@media (prefers-reduced-motion:no-preference){.tab,.day,.st{transition:color .15s,border-color .15s,background-color .15s}}
</style>

<script>

};

const DAYS=[

 {t:"11:45",cat:"tr",n:"抵達神戶機場・入境",jp:"神戸空港 第2ターミナル",q:"Kobe Airport Terminal 2",dl:"入境約 30–45 分鐘",

const K="kobe26:";
function load(k,d){try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}
function jst(){
  try{const s=new Date().toLocaleString("sv-SE",{timeZone:"Asia/Tokyo"});return {date:s.slice(0,10),hm:s.slice(11,16)}}
  catch(e){const s=new Date(Date.now()+9*3600e3).toISOString();return {date:s.slice(0,10),hm:s.slice(11,16)}}
}

const gm=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const ntd=n=>"NT$ "+Math.round(n).toLocaleString("en-US");

function countText(){
  const start=Date.UTC(2026,10,12), end=Date.UTC(2026,10,16);
  const [y,m,d]=NOW.date.split("-").map(Number); const t=Date.UTC(y,m-1,d);
  const diff=Math.round((start-t)/864e5);
  if(diff>1)return `${diff} 天後出發`;
  if(diff===1)return "明天出發";
  if(t<=end)return `旅程第 ${Math.round((t-start)/864e5)+1} 天`;
  return "旅程結束";
}
function nowIndex(day){
  if(DAYS.indexOf(day)!==todayIdx)return -1;
  let idx=-1; day.items.forEach((it,i)=>{if((it.cmp||it.t)<=NOW.hm)idx=i}); return idx;
}
function block(b){
  if(b.d)return `<div class="desc">${b.d}</div>`;
  if(b.n)return `<div class="note">${b.h?`<b>${b.h}</b>`:""}${b.n}</div>`;
  if(b.r)return `<div class="route">${b.r.map(([l,t])=>{const L=LINES[l];return `<div class="rr"><span class="ln" style="--lc:var(${L[1]})">${L[0]}</span><span>${t}</span></div>`}).join("")}</div>`;
  if(b.f)return `<div class="opts"><div class="opl">${b.f.l}</div>${b.f.o.map(o=>`<div class="op"><div class="oph"><span class="opn">${o.n}</span>${o.p?`<span class="opp">${o.p}</span>`:""}${o.b?`<span class="opb">${o.b}</span>`:""}${o.q?`<a class="opm" href="${gm(o.q)}" target="_blank" rel="noopener">地圖 ↗</a>`:""}</div>${o.d?`<div class="opd">${o.d}</div>`:""}</div>`).join("")}</div>`;
  return "";
}
function talksHtml(t){
  return `<div class="talks"><div class="ch">${esc(t.ch)}</div>${t.l.map(r=>`<div class="tk"><span class="tt">${r[0]}</span><div><div class="who">${esc(r[1])}</div><div class="ttl">${esc(r[2])}</div></div></div>`).join("")}</div>`;
}
function subtabs(list,cur,act){return `<div class="subtabs g">${list.map(([k,l])=>`<button class="st" data-act="${act}" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join("")}</div>`}

function viewPlan(){
  const d=DAYS[sel], ni=nowIndex(d);
  const days=`<div class="days g">${DAYS.map((x,i)=>`<button class="day" data-day="${i}" aria-pressed="${i===sel}" aria-label="11/${x.d} ${x.dw} ${x.city}${i===todayIdx?"（今天）":""}">${i===todayIdx?'<span class="td" aria-hidden="true"></span>':""}<div class="dw">${x.dw}</div><div class="dd">${x.d}</div><div class="dc">${x.city}</div></button>`).join("")}</div>`;
  const head=`<div class="dh g"><div class="ey">第 ${sel+1} 天・11/${d.d}（${d.dw}）</div><h2>${d.title}</h2><div class="ds">${d.sum}</div>
    <div class="facts">
      <div class="fact"><div class="k">天氣</div><div class="v">${d.wx[0]}<small>${d.wx[1]}<br>${d.wx[2]}</small></div></div>
      <div class="fact"><div class="k">住宿</div><div class="v">${d.stay[0]}<small>${d.stay[1]}</small></div></div>
      <div class="fact"><div class="k">節奏</div><div class="v">${d.pace[0]}<small>${d.pace[1]}</small></div></div>
    </div></div>`;
  const anyOpen=d.items.some((it,i)=>it.x&&open.has(sel+"-"+i));
  const bar=`<div class="bar g"><button class="linkbtn" data-act="all">${anyOpen?"全部收合 −":"全部展開 ＋"}</button></div>`;
  const tl=`<div class="tl g">${d.items.map((it,i)=>{
    const key=sel+"-"+i, isOpen=open.has(key), C=CAT[it.cat]||CAT.tr;
    const durTxt=it.dl?it.dl:it.dur?`${it.cat==="tr"?"車程":"停留"} ${it.dur}`:(it.tz||"");
    return `<div class="it${i===ni?" now":""}">
      <div class="tcol"><div class="tm">${it.t}</div>${i===ni?'<span class="nw">現在</span>':""}</div>
      <div class="body">
        <div class="cat"><span>${C[0]}</span>${durTxt?`<span class="du">${durTxt}</span>`:""}${it.q?`<a class="mp" href="${gm(it.q)}" target="_blank" rel="noopener">地圖 ↗</a>`:""}</div>
        <div class="nm"><span>${it.n}</span>${it.bd?`<span class="bd">${it.bd}</span>`:""}</div>
        ${it.jp?`<div class="jp" lang="ja">${it.jp}</div>`:""}
        ${it.sum?`<div class="sm">${it.sum}</div>`:""}
        ${it.price?`<div class="pr">${it.price}</div>`:""}
        ${it.talks?talksHtml(it.talks):""}
        ${it.x?`<button class="more" data-act="toggle" data-key="${key}" aria-expanded="${isOpen}" aria-label="${isOpen?"收合詳細":"展開詳細"}">${isOpen?"−":"＋"}</button>`:""}
        ${it.x&&isOpen?`<div class="x">${it.x.map(block).join("")}</div>`:""}
      </div></div>`}).join("")}</div><div class="tfoot g">天氣為 tenki.jp 11/11 發布的神戶預報。</div>`;
  return days+head+bar+tl;
}

  }else{
    h=`<section class="sec g"><h3>必買清單</h3>`+
      BUY.map(s=>`<div class="grp" style="margin-top:16px">${s.h}</div><div class="list">${s.items.map(foodRow).join("")}</div>`).join("")+`</section>`;
  }
  return st+h+`<div class="foot g">價格是 2026 年的參考區間，營業時間以店家公告為準。</div>`;
}

      <section class="sec g"><h3>主要路線</h3><div class="list">
      ${[["11/12","神戶機場 → 三宮","T2 步行約 10 分鐘到站，Port Liner 約 18 分鐘・¥340"],["11/13","三宮 → 神戶大學","阪急到六甲約 8 分鐘，再搭公車或計程車約 10 分鐘"],["11/14","三宮 → 新神戶","神戶地鐵 1 站約 2 分鐘"],["11/14","三宮 → りんくうタウン","機場巴士到關西機場 T1 約 65 分鐘・¥2,200，再搭電車一站・¥370（備案：JR 約 1 小時 40 分鐘・約 ¥1,600）"],["11/15","りんくうタウン → 難波","南海空港急行約 49 分鐘・¥820"],["11/15","難波 → 梅田","御堂筋線約 8 分鐘・¥240"],["11/15","大阪 → りんくうタウン","JR 關空快速約 67 分鐘・約 ¥1,000"],["11/16","OMO → 關西機場 T1","飯店接駁巴士 10:00 發車・約 10 分鐘"]].map(([d,a,b])=>`<div class="row"><div class="row-t"><div class="rn">${a}</div><div class="rd">${b}</div></div><span class="rday">${d}</span></div>`).join("")}</div></section>`;

      <div class="grp" style="margin-top:20px">出境時（11/16 關西機場 T1）</div>
      <div class="ol">
        <div>到國際線出發大廳，在託運行李之前，到免稅手續 kiosk 刷護照；關西機場也可以在保安檢查前用 Visit Japan Web 線上辦理。</div>
        <div>螢幕顯示綠色：完成，可以去託運。顯示紅色：帶著所有免稅商品到旁邊的海關櫃台受檢。</div>
        <div>確認完成後，由店家或退稅代辦業者把消費稅退到登記的帳戶。</div></div>
      <div class="note" style="margin-top:14px"><b>注意</b>先託運再辦理不行，託運的行李也不能拿回來。必須在登機手續前完成；因辦理退稅而誤機，航空公司與海關都不負責。</div>

        <div class="row"><div class="row-t"><div class="rn">消耗品拆封使用</div><div class="rd">化妝品、食品、藥品出境前不要拆封；已在日本使用的要主動告知海關，不能辦理。</div></div></div>

      <div class="grp" style="margin-top:20px">退款與手續費</div>

      <div class="grp" style="margin-top:20px">這次行程的建議</div>
      <div class="desc" style="margin-top:6px">退稅商品和收據集中放在同一個袋子；11/16 到 T1 先辦 kiosk、再去星宇櫃台託運，預留 15–20 分鐘。</div></section>`;
  }else{
    h=`<section class="sec g"><h3>緊急聯絡</h3><div class="list" style="border-top:0">
      ${[["警察","110"],["救護車・消防","119"],["訪日外國人熱線（JNTO，24 小時，可說中文）","050-3816-2787"],["駐大阪辦事處 急難救助（日本境內撥打）","090-8794-4568"],["駐大阪辦事處（上班時間）","06-6227-8623"]].map(([n,t])=>`<div class="tel"><div class="row-t"><div class="rd" style="margin:0">${n}</div><div class="tn">${t}</div></div><button class="copy" data-act="copy" data-text="${t}">複製</button></div>`).join("")}</div></section>`;
  }

function convResult(){
  if(dir==="jpy")return {v:ntd(amt*rate),s:`${yen(amt)} × ${rate}`};
  return {v:yen(rate?amt/rate:0),s:`NT$ ${amt.toLocaleString("en-US")} ÷ ${rate}`};
}
function quickRows(){return [100,500,1000,2000,3000,5000,10000,20000].map(n=>`<div><span>${yen(n)}</span><span>${ntd(n*rate)}</span></div>`).join("")}
function viewRate(){
  const r=convResult();
  return `<section class="sec g"><h3>匯率換算</h3><div class="conv">
    <div class="cv-row"><label for="rate">匯率</label><span class="unit">¥1 =</span><input class="cv-in sm" id="rate" type="number" inputmode="decimal" step="0.001" value="${rate}"><span class="unit">NT$</span></div>
    <div class="cv-row"><label for="amt">金額</label><input class="cv-in" id="amt" type="number" inputmode="decimal" value="${amt}">
      <span class="seg"><button data-act="dir" data-dir="jpy" aria-pressed="${dir==="jpy"}">日幣</button><button data-act="dir" data-dir="twd" aria-pressed="${dir==="twd"}">台幣</button></span></div>
    <div class="result"><div class="rl">換算結果</div><div class="rv" id="rv">${r.v}</div><div class="rl" id="rs">${r.s}</div></div>
    <div class="qt" id="qt">${quickRows()}</div>
    <div class="hint">預設 0.213 是臺灣銀行 11 月初的日幣現金賣出匯率。可以改成你換匯或刷卡的匯率，會記在這支手機上。</div>
  </div></section><div class="foot g">退稅門檻：同一家店同一天 ¥5,000（未稅）以上。</div>`;
}
/* ═══════════ RENDER ═══════════ */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  const v=document.getElementById("view");
  v.setAttribute("aria-labelledby","tab-"+tab);
  v.innerHTML=tab==="plan"?viewPlan():tab==="food"?viewFood():tab==="places"?viewPlaces():viewInfo();
}
/* re-render, then put focus back on the control that was used */
function rr(el){
  const sel2=[...el.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${CSS.escape?CSS.escape(x.value):x.value}"]`).join("");
  render();
  if(sel2){const n=document.querySelector("#view "+sel2);if(n)n.focus({preventScroll:true})}
}
function updateConv(){
  const r=convResult();
  const rv=document.getElementById("rv"),rs=document.getElementById("rs"),qt=document.getElementById("qt");
  if(rv)rv.textContent=r.v; if(rs)rs.textContent=r.s; if(qt)qt.innerHTML=quickRows();
}
function tick(){
  const prevIdx=todayIdx, prevNow=todayIdx>=0?nowIndex(DAYS[sel]):-1;
  NOW=jst(); todayIdx=DAYS.findIndex(d=>d.iso===NOW.date);
  document.getElementById("count").textContent=countText();
  if(tab==="plan"&&(prevIdx!==todayIdx||prevNow!==nowIndex(DAYS[sel])))render();
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  tab=b.dataset.tab; save("tab",tab); render();
  const hd=document.querySelector(".hd"); const h=hd?hd.offsetHeight:0;
  if(window.scrollY>h)window.scrollTo({top:h});
});
document.getElementById("view").addEventListener("click",e=>{
  const day=e.target.closest("[data-day]");
  if(day){sel=+day.dataset.day;save("day",sel);rr(day);return}
  const a=e.target.closest("[data-act]"); if(!a)return;
  const act=a.dataset.act;
  if(act==="toggle"){const k=a.dataset.key;open.has(k)?open.delete(k):open.add(k);rr(a)}
  else if(act==="all"){const d=DAYS[sel];const any=d.items.some((it,i)=>it.x&&open.has(sel+"-"+i));d.items.forEach((it,i)=>{if(it.x){const k=sel+"-"+i;any?open.delete(k):open.add(k)}});rr(a)}
  else if(act==="food"){foodSub=a.dataset.k;save("foodSub",foodSub);rr(a)}
  else if(act==="info"){infoSub=a.dataset.k;save("infoSub",infoSub);rr(a)}
  else if(act==="place"){placeSub=a.dataset.k;save("placeSub",placeSub);rr(a)}
  else if(act==="dir"){dir=a.dataset.dir;save("dir",dir);rr(a)}
  else if(act==="copy"){
    const txt=a.dataset.text, orig=a.dataset.label||(a.dataset.label=a.textContent);
    const ok=()=>{a.textContent="已複製";setTimeout(()=>{a.textContent=orig},1400)};
    const fallback=()=>{const el=a.parentElement.querySelector(".ad,.tn");if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}a.textContent="已選取，請長按複製";setTimeout(()=>{a.textContent=orig},2000)};
    try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(err){fallback()}
  }
});
document.getElementById("view").addEventListener("input",e=>{
  if(e.target.id==="rate"){rate=parseFloat(e.target.value)||0;save("rate",rate);updateConv()}
  else if(e.target.id==="amt"){amt=parseFloat(e.target.value)||0;save("amt",amt);updateConv()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick()});
setInterval(tick,60000);
document.getElementById("count").textContent=countText();
render();
if(tab==="plan"&&todayIdx===sel){const n=document.querySelector(".it.now");if(n)n.scrollIntoView({block:"center"})}
</script>
